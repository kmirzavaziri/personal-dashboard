<style>

  .dd-trigger .dd-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-trigger .dd-label.placeholder { color: var(--muted); }
  .dd-trigger svg { flex: none; color: var(--faint); transition: transform 0.15s; }
  .dd-trigger[aria-expanded="true"] { border-color: var(--faint); }
  .dd-trigger:focus-visible { outline: none; border-color: var(--faint); }

  @media (hover: hover) { .dd.quiet .dd-trigger:hover { border-color: var(--border-strong); } }

  .dd.tone .dd-trigger {
    width: auto; height: 1.5rem; padding: 0 0.45rem 0 0.5rem; gap: 0.35rem; border-radius: 999px;
    font-size: 0.74rem; font-weight: 500; color: var(--strong);
    border-color: color-mix(in srgb, var(--tone, var(--faint)) 55%, transparent);
    background: color-mix(in srgb, var(--tone, var(--faint)) 8%, transparent);
  }
  @media (hover: hover) { .dd.tone .dd-trigger:hover { border-color: var(--tone, var(--faint)); } }

  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 0.95rem; height: 0.95rem; }
  label.field { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--muted); }

  .bar { height: 6px; border-radius: 999px; background: var(--raised); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

  .bar.yellow > span { background: var(--yellow); }
  .bar.red > span { background: var(--red); }

  .has-tooltip { position: relative; cursor: help; }

  @media (hover: hover) { .has-tooltip:hover .tooltip-box { display: block; } }

  .modal-overlay {

  }
  .modal-overlay.open { display: flex; }
  .modal, dialog.modal {

    padding: 1.2rem 1.4rem 1.3rem; box-shadow: var(--shadow-pop);

    background: none; border: none; color: var(--muted); font-size: 1.15rem; line-height: 1; cursor: pointer;
  }
  .modal-close:hover { background: var(--hover); color: var(--strong); }

  .toast {
    position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom)); z-index: 1100;
    transform: translate(-50%, 1rem); opacity: 0; pointer-events: none;
    background: var(--strong); color: var(--bg); font-size: 0.8rem; font-weight: 500;
    padding: 0.45rem 0.9rem; border-radius: 999px; box-shadow: var(--shadow-pop);

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  dialog.modal[open], .modal-overlay.open .modal { animation: pop 0.16s ease-out; }

  section, .tile, .btn, .dd-trigger, tbody tr td { transition-timing-function: ease; }

  @media (prefers-reduced-motion: reduce) {

  @media (max-width: 900px) {

    table.stacked .thumb-col img { width: 44px; height: 44px; }
    table.stacked .tooltip-box { left: auto; right: 0; }
    @media (hover: hover) { table.stacked tbody tr:hover td { background: none; } }
  }

  @media (pointer: coarse) {
