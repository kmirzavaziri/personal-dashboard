<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}Dashboard{% endblock %}</title>
  {% include "head_meta.html" %}
  {% include "components.html" %}
  <style>
    body {
      --pad: 1.4rem;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv11', 'ss01';
      margin: 0;
      min-height: 100vh;
    }

    .crumbs {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;
      font-size: 0.84rem;
      padding: calc(0.6rem + env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)) 0.6rem max(var(--pad), env(safe-area-inset-left));
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .crumbs a { color: var(--muted); text-decoration: none; transition: color 0.15s ease; }
    .crumbs a:hover { color: var(--strong); }
    .crumb-brand { font-family: var(--font-display); font-size: 0.98rem; font-weight: 500; color: var(--strong) !important; }
    .crumb-sep { color: var(--faint); }
    .crumb-current { color: var(--strong); font-weight: 500; }

    main {
      display: block;
      max-width: {% block max_width %}1100px{% endblock %};
      margin: 0 auto;
      padding: var(--pad)
               max(var(--pad), env(safe-area-inset-right))
               max(var(--pad), env(safe-area-inset-bottom))
               max(var(--pad), env(safe-area-inset-left));
    }

    [id] { scroll-margin-top: calc(var(--nav-h, 3.2rem) + 0.6rem); }

    @media (max-width: 900px) { body { --pad: 1rem; } }
    @media (max-width: 600px) { body { --pad: 0.8rem; } }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

{% set h = self.heading()|trim %}
<nav class="crumbs">
  <a href="/" id="back-home" class="crumb-brand">Personal Dashboard</a>
  {% if h %}<span class="crumb-sep">/</span><span class="crumb-current">{{ h }}</span>{% endif %}
</nav>
<script>
  (function () {
    var link = document.getElementById('back-home');
    link.addEventListener('click', function (e) {
      if (location.pathname === '/') return;
      if (!document.referrer) return;
      try {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin && ref.pathname === '/') {
          e.preventDefault();
          history.back();
        }
      } catch (err) {}
    });
  })();
</script>

<script>
  (function () {
    var nav = document.querySelector('.crumbs');
    function setNavH() { document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px'); }
    setNavH();
    window.addEventListener('resize', setNavH);
  })();
</script>

<main class="{% block wrap %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<script>
  (function () {
    document.querySelectorAll('[role="tablist"][data-tabs]').forEach(function (list) {
      var group = list.dataset.tabs;
      var tabs = Array.prototype.slice.call(list.querySelectorAll('[role="tab"]'));
      function show(key) {
        tabs.forEach(function (tab) { tab.setAttribute('aria-selected', String(tab.dataset.tab === key)); });
        document.querySelectorAll('[role="tabpanel"][data-tabs="' + group + '"]').forEach(function (panel) {
          panel.hidden = panel.dataset.tab !== key;
        });
      }
      var memory = 'tab:' + location.pathname + ':' + group;
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          show(tab.dataset.tab);
          try { sessionStorage.setItem(memory, tab.dataset.tab); } catch (e) {}
        });
      });
      var remembered;
      try { remembered = sessionStorage.getItem(memory); } catch (e) {}
      var initial = tabs.some(function (t) { return t.dataset.tab === remembered; }) ? remembered : tabs.length && tabs[0].dataset.tab;
      if (initial) show(initial);
    });
  })();
</script>

<script>
  (function () {
    document.querySelectorAll('table').forEach(function (table) {
      var head = table.tHead && table.tHead.rows[table.tHead.rows.length - 1];
      if (!head) return;
      var labels = [];
      Array.prototype.forEach.call(head.cells, function (th) {
        for (var i = 0; i < th.colSpan; i++) labels.push(th.textContent.trim());
      });
      if (labels.filter(Boolean).length < 3) return;
      var title = labels.findIndex(Boolean);
      table.classList.add('stacked');
      Array.prototype.forEach.call(table.tBodies, function (body) {
        Array.prototype.forEach.call(body.rows, function (row) {
          var col = 0;
          Array.prototype.forEach.call(row.cells, function (td) {
            if (td.colSpan > 1) { col += td.colSpan; return; }
            if (col === title) td.classList.add('cell-title');
            else if (labels[col]) td.dataset.label = labels[col];
            else td.classList.add('cell-bare');
            col++;
          });
        });
      });
    });
  })();
</script>

<script>
  (function () {
    if (matchMedia('(hover: hover)').matches) return;
    function closeAll() {
      document.querySelectorAll('.has-tooltip.tt-open').forEach(function (o) { o.classList.remove('tt-open'); });
    }
    document.querySelectorAll('.has-tooltip').forEach(function (el) {
      if (el.querySelector('a')) return;
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = el.classList.contains('tt-open');
        closeAll();
        if (!open) el.classList.add('tt-open');
      });
    });
    document.addEventListener('click', closeAll);
  })();
</script>

<script>
  (function () {
    var KEY = 'details-open';
    var page = location.pathname;
    var map;
    try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { map = {}; }
    document.querySelectorAll('details').forEach(function (d, i) {
      var s = d.querySelector('summary');
      var id = page + '::' + (s ? s.textContent.trim() : String(i));
      if (id in map) { map[id] ? d.setAttribute('open', '') : d.removeAttribute('open'); }
      d.addEventListener('toggle', function () {
        map[id] = d.open;
        try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) {}
      });
    });
  })();
</script>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  window.toast = function (message, isError) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(window.toast.timer);
    window.toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  };
  window.api = function (url, method, body) {
    return fetch(url, {
      method: method || 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    }).then(function (r) {
      if (r.ok) return r.json();
      return r.text().then(function (t) { window.toast(t || 'Request failed', true); throw new Error(t); });
    });
  };
</script>

{% block scripts %}{% endblock %}
</body>
</html>
