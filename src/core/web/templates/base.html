<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}Dashboard{% endblock %}</title>
  {% include "head_meta.html" %}
  {% include "components.html" %}
  <style>
    body {
      --pad: 1.4rem;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.875rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv11', 'ss01';
      margin: 0;
      min-height: 100vh;
    }

    .crumbs {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;
      font-size: 0.84rem;
      padding: calc(0.6rem + env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)) 0.6rem max(var(--pad), env(safe-area-inset-left));
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .crumbs a { color: var(--muted); text-decoration: none; transition: color 0.15s ease; }
    .crumbs a:hover { color: var(--strong); }
    .crumb-brand { font-weight: 600; color: var(--strong) !important; }
    .crumb-sep { color: var(--faint); }
    .crumb-current { color: var(--strong); font-weight: 500; }

    main {
      display: block;
      max-width: {% block max_width %}1100px{% endblock %};
      margin: 0 auto;
      padding: var(--pad)
               max(var(--pad), env(safe-area-inset-right))
               max(var(--pad), env(safe-area-inset-bottom))
               max(var(--pad), env(safe-area-inset-left));
    }

    [id] { scroll-margin-top: calc(var(--nav-h, 3.2rem) + 0.6rem); }

    @media (max-width: 900px) { body { --pad: 1rem; } }
    @media (max-width: 600px) { body { --pad: 0.8rem; } }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">

{% set h = self.heading()|trim %}
<nav class="crumbs">
  <a href="/" id="back-home" class="crumb-brand">Personal Dashboard</a>
  {% if h %}<span class="crumb-sep">/</span><span class="crumb-current">{{ h }}</span>{% endif %}
</nav>
<script>
  (function () {
    var link = document.getElementById('back-home');
    link.addEventListener('click', function (e) {
      if (location.pathname === '/') return;
      if (!document.referrer) return;
      try {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin && ref.pathname === '/') {
          e.preventDefault();
          history.back();
        }
      } catch (err) {}
    });
  })();
</script>

<script>
  (function () {
    var nav = document.querySelector('.crumbs');
    function setNavH() { document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px'); }
    setNavH();
    window.addEventListener('resize', setNavH);
  })();
</script>

<main class="{% block wrap %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<script>
  (function () {
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    function pad(n) { return String(n).padStart(2, '0'); }
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function human(at, dateOnly, now) {
      var minutes = Math.floor((now - at) / 60000);
      var days = Math.round((startOfDay(now) - startOfDay(at)) / 86400000);
      var clock = pad(at.getHours()) + ':' + pad(at.getMinutes());
      var date = MONTHS[at.getMonth()] + ' ' + at.getDate() + (at.getFullYear() !== now.getFullYear() ? ', ' + at.getFullYear() : '');
      if (dateOnly) return days === 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? DAYS[at.getDay()] : date;
      if (minutes < 1 && minutes > -1) return 'Now';
      if (minutes >= 1 && minutes < 60) return minutes + 'm ago';
      if (days === 0 && minutes < 360) return Math.floor(minutes / 60) + 'h ago';
      if (days === 0) return clock;
      if (days === 1) return 'Yesterday ' + clock;
      if (days < 7 && days > 0) return DAYS[at.getDay()] + ' ' + clock;
      return date + ', ' + clock;
    }
    window.humanizeTimes = function (root) {
      var now = new Date();
      (root || document).querySelectorAll('time[data-human]').forEach(function (el) {
        var raw = el.getAttribute('datetime');
        var dateOnly = el.dataset.human === 'date';
        var at = dateOnly ? new Date(raw + 'T12:00:00') : new Date(raw);
        if (isNaN(at)) return;
        el.textContent = human(at, dateOnly, now);
        if (!el.title) el.title = at.toLocaleString();
      });
    };
    humanizeTimes();
    setInterval(humanizeTimes, 60000);
  })();
</script>

<script>
  (function () {
    var CHEVRON = '<svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var CHECK = '<svg class="dd-check" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5l3.5 3.5L11 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var SEARCH_FROM = 9;
    var valueProp = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
    var indexProp = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'selectedIndex');
    var menu = document.createElement('div');
    menu.className = 'dd-menu';
    menu.hidden = true;
    menu.innerHTML = '<input class="dd-search" type="search" placeholder="Search…" aria-label="Filter options"><div class="dd-options" role="listbox"></div>';
    var search = menu.querySelector('.dd-search');
    var list = menu.querySelector('.dd-options');
    var current = null;
    var active = -1;

    function label(select) {
      var option = select.options[select.selectedIndex];
      var el = select._dd.querySelector('.dd-label');
      if (select.multiple) {
        var chosen = Array.prototype.map.call(select.selectedOptions, function (o) { return o.dataset.short || o.text; });
        var compact = Array.prototype.every.call(select.selectedOptions, function (o) { return o.dataset.short; });
        el.textContent = !chosen.length ? (select.dataset.placeholder || 'None') : (compact || chosen.length <= 2) ? chosen.join(', ') : chosen.length + ' selected';
        el.classList.toggle('placeholder', !chosen.length);
        return;
      }
      el.textContent = option ? option.text : '';
      el.classList.toggle('placeholder', !option || option.value === '');
      if (select._dd.classList.contains('tone')) select._dd.style.setProperty('--tone', (option && option.dataset.tone) || 'var(--faint)');
    }

    function enhance(select) {
      if (select._dd || select.hasAttribute('data-native')) return;
      var wrap = document.createElement('span');
      var toned = select.classList.contains('tone');
      wrap.className = 'dd' + (select.classList.contains('input-quiet') ? ' quiet' : '') + (toned ? ' tone' : '');
      var trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'dd-trigger';
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      if (select.getAttribute('aria-label')) trigger.setAttribute('aria-label', select.getAttribute('aria-label'));
      trigger.innerHTML = (toned ? '<span class="dd-dot"></span>' : '') + '<span class="dd-label"></span>' + CHEVRON;
      trigger.disabled = select.disabled;
      select.parentNode.insertBefore(wrap, select);
      wrap.appendChild(select);
      wrap.appendChild(trigger);
      select.tabIndex = -1;
      select.setAttribute("aria-hidden", "true");
      select._dd = wrap;
      Object.defineProperty(select, 'value', {
        configurable: true,
        get: function () { return valueProp.get.call(this); },
        set: function (v) { valueProp.set.call(this, v); label(this); },
      });
      Object.defineProperty(select, 'selectedIndex', {
        configurable: true,
        get: function () { return indexProp.get.call(this); },
        set: function (v) { indexProp.set.call(this, v); label(this); },
      });
      select.dataset.saved = select.value;
      select.addEventListener('change', function () { label(select); });
      trigger.addEventListener('click', function () { current === select ? close() : open(select); });
      trigger.addEventListener('keydown', function (e) {
        if (['ArrowDown', 'ArrowUp', 'Enter', ' '].indexOf(e.key) !== -1 && current !== select) { e.preventDefault(); open(select); }
      });
      label(select);
    }

    function options() { return Array.prototype.slice.call(list.querySelectorAll('.dd-option')); }

    function render(filter) {
      var needle = (filter || '').trim().toLowerCase();
      list.innerHTML = '';
      Array.prototype.forEach.call(current.options, function (option, index) {
        if (option.hidden || option.disabled) return;
        if (needle && option.text.toLowerCase().indexOf(needle) === -1) return;
        var row = document.createElement('div');
        row.className = 'dd-option';
        row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', String(current.multiple ? option.selected : index === current.selectedIndex));
        row.dataset.index = index;
        row.innerHTML = CHECK;
        if (option.dataset.tone) {
          var dot = document.createElement('span');
          dot.className = 'dd-dot';
          dot.style.setProperty('--tone', option.dataset.tone);
          row.appendChild(dot);
        }
        row.appendChild(document.createTextNode(option.text));
        list.appendChild(row);
      });
      if (!list.children.length) list.innerHTML = '<div class="dd-empty">No matches</div>';
      var rows = options();
      var selected = rows.findIndex(function (r) { return r.getAttribute('aria-selected') === 'true'; });
      highlight(needle ? 0 : Math.max(selected, 0));
    }

    function highlight(index) {
      var rows = options();
      if (!rows.length) { active = -1; return; }
      active = (index + rows.length) % rows.length;
      rows.forEach(function (r, i) { r.classList.toggle('active', i === active); });
      rows[active].scrollIntoView({ block: 'nearest' });
    }

    function place() {
      var rect = current._dd.getBoundingClientRect();
      menu.style.minWidth = Math.max(rect.width, 160) + 'px';
      var below = window.innerHeight - rect.bottom;
      var height = menu.offsetHeight;
      menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8) + 'px';
      menu.style.top = (below < height + 12 && rect.top > below ? rect.top - height - 4 : rect.bottom + 4) + 'px';
    }

    function loadOptions(select) {
      var source = select.dataset.optionsFrom && document.getElementById(select.dataset.optionsFrom);
      if (!source || select._optionsLoaded) return;
      var chosen = select.value;
      var offered = Array.prototype.map.call(source.content.children, function (option) { return option.value; });
      Array.prototype.slice.call(select.options).forEach(function (option) {
        if (offered.indexOf(option.value) !== -1) option.remove();
      });
      Array.prototype.forEach.call(source.content.children, function (option) { select.appendChild(option.cloneNode(true)); });
      select.value = chosen;
      select._optionsLoaded = true;
    }

    function open(select) {
      close();
      loadOptions(select);
      current = select;
      select._dd.querySelector('.dd-trigger').setAttribute('aria-expanded', 'true');
      var host = select.closest('dialog[open]') || document.body;
      if (menu.parentNode !== host) host.appendChild(menu);
      list.setAttribute('aria-multiselectable', String(select.multiple));
      search.hidden = select.options.length < SEARCH_FROM;
      search.value = '';
      render('');
      menu.hidden = false;
      place();
      highlight(active);
      (search.hidden ? list : search).focus({ preventScroll: true });
    }

    function close(refocus) {
      if (!current) return;
      var trigger = current._dd.querySelector('.dd-trigger');
      trigger.setAttribute('aria-expanded', 'false');
      menu.hidden = true;
      if (refocus) trigger.focus();
      current = null;
    }

    function choose(row) {
      var select = current;
      var index = Number(row.dataset.index);
      if (select.multiple) {
        var option = select.options[index];
        option.selected = !option.selected;
        row.setAttribute('aria-selected', String(option.selected));
        label(select);
        select.dispatchEvent(new Event('change', { bubbles: true }));
        return;
      }
      var changed = index !== select.selectedIndex;
      select.selectedIndex = index;
      close(true);
      if (changed) select.dispatchEvent(new Event('change', { bubbles: true }));
    }

    list.tabIndex = -1;
    list.addEventListener('mousedown', function (e) { e.preventDefault(); });
    list.addEventListener('click', function (e) {
      var row = e.target.closest('.dd-option');
      if (row) choose(row);
    });
    list.addEventListener('mousemove', function (e) {
      var row = e.target.closest('.dd-option');
      if (row) highlight(options().indexOf(row));
    });
    search.addEventListener('input', function () { render(search.value); });
    menu.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); highlight(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); highlight(active - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); var rows = options(); if (rows[active]) choose(rows[active]); }
      else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); close(true); }
      else if (e.key === ' ' && current && current.multiple && search.hidden) { e.preventDefault(); var hits = options(); if (hits[active]) choose(hits[active]); }
      else if (search.hidden && e.key.length === 1) {
        var rows = options();
        var hit = rows.findIndex(function (r) { return r.textContent.trim().toLowerCase().indexOf(e.key.toLowerCase()) === 0; });
        if (hit !== -1) highlight(hit);
      }
    });
    document.addEventListener('mousedown', function (e) {
      if (current && !menu.contains(e.target) && !current._dd.contains(e.target)) close();
    });
    window.addEventListener('resize', function () { close(); });
    document.addEventListener('scroll', function (e) {
      if (!current || menu.contains(e.target)) return;
      var rect = current._dd.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) close(); else place();
    }, true);

    document.addEventListener('change', function (e) {
      var select = e.target;
      if (!select.matches || !select.matches('select[data-status-endpoint]')) return;
      var previous = select.dataset.saved;
      window.api(select.dataset.statusEndpoint + '/' + encodeURIComponent(select.dataset.key) + '/status', 'POST', { status: select.value })
        .then(function () { select.dataset.saved = select.value; window.toast('Status: ' + select.options[select.selectedIndex].text); })
        .catch(function () { select.value = previous; });
    });

    document.querySelectorAll('select').forEach(enhance);
    new MutationObserver(function (records) {
      records.forEach(function (record) {
        record.addedNodes.forEach(function (node) {
          if (node.nodeType !== 1) return;
          if (node.matches('select')) enhance(node);
          node.querySelectorAll && node.querySelectorAll('select').forEach(enhance);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  })();
</script>

<script>
  (function () {
    document.querySelectorAll('[role="tablist"][data-tabs]').forEach(function (list) {
      var group = list.dataset.tabs;
      var tabs = Array.prototype.slice.call(list.querySelectorAll('[role="tab"]'));
      function show(key) {
        tabs.forEach(function (tab) { tab.setAttribute('aria-selected', String(tab.dataset.tab === key)); });
        document.querySelectorAll('[role="tabpanel"][data-tabs="' + group + '"]').forEach(function (panel) {
          panel.hidden = panel.dataset.tab !== key;
        });
      }
      var memory = 'tab:' + location.pathname + ':' + group;
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var key = list.dataset.deselect && tab.getAttribute('aria-selected') === 'true' ? list.dataset.deselect : tab.dataset.tab;
          show(key);
          try { sessionStorage.setItem(memory, key); } catch (e) {}
        });
      });
      var remembered;
      try { remembered = sessionStorage.getItem(memory); } catch (e) {}
      var initial = tabs.some(function (t) { return t.dataset.tab === remembered; }) ? remembered : tabs.length && tabs[0].dataset.tab;
      if (initial) show(initial);
    });
  })();
</script>

<script>
  (function () {
    document.querySelectorAll('table').forEach(function (table) {
      var head = table.tHead && table.tHead.rows[table.tHead.rows.length - 1];
      if (!head) return;
      var labels = [];
      Array.prototype.forEach.call(head.cells, function (th) {
        for (var i = 0; i < th.colSpan; i++) labels.push(th.textContent.trim());
      });
      if (labels.filter(Boolean).length < 3) return;
      var title = labels.findIndex(Boolean);
      table.classList.add('stacked');
      Array.prototype.forEach.call(table.tBodies, function (body) {
        Array.prototype.forEach.call(body.rows, function (row) {
          var col = 0;
          Array.prototype.forEach.call(row.cells, function (td) {
            if (td.colSpan > 1) { col += td.colSpan; return; }
            if (col === title) td.classList.add('cell-title');
            else if (labels[col]) td.dataset.label = labels[col];
            else td.classList.add('cell-bare');
            col++;
          });
        });
      });
    });
  })();
</script>

<script>
  (function () {
    if (matchMedia('(hover: hover)').matches) return;
    function closeAll() {
      document.querySelectorAll('.has-tooltip.tt-open').forEach(function (o) { o.classList.remove('tt-open'); });
    }
    document.querySelectorAll('.has-tooltip').forEach(function (el) {
      if (el.querySelector('a')) return;
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = el.classList.contains('tt-open');
        closeAll();
        if (!open) el.classList.add('tt-open');
      });
    });
    document.addEventListener('click', closeAll);
  })();
</script>

<script>
  (function () {
    var KEY = 'details-open';
    var page = location.pathname;
    var map;
    try { map = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { map = {}; }
    document.querySelectorAll('details').forEach(function (d, i) {
      var s = d.querySelector('summary');
      var id = page + '::' + (s ? s.textContent.trim() : String(i));
      if (id in map) { map[id] ? d.setAttribute('open', '') : d.removeAttribute('open'); }
      d.addEventListener('toggle', function () {
        map[id] = d.open;
        try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) {}
      });
    });
  })();
</script>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  window.toast = function (message, isError) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(window.toast.timer);
    window.toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  };
  window.api = function (url, method, body) {
    return fetch(url, {
      method: method || 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    }).then(function (r) {
      if (r.ok) return r.json();
      return r.text().then(function (t) { window.toast(t || 'Request failed', true); throw new Error(t); });
    });
  };
</script>

{% block scripts %}{% endblock %}
</body>
</html>
