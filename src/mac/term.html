<!DOCTYPE html>
<html lang="en">
<head>
  {% include "head_meta.html" %}
  <title>Terminal · My Mac</title>
  {% include "components.html" %}
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; color: var(--text); font-family: var(--font-ui); font-size: 0.875rem; -webkit-font-smoothing: antialiased; }
    .term-bar {
      display: flex; align-items: center; gap: 0.8rem;
      padding: calc(0.5rem + env(safe-area-inset-top)) 0.9rem 0.5rem;
      background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .term-bar a { color: var(--muted); text-decoration: none; white-space: nowrap; }
    @media (hover: hover) { .term-bar a:hover { color: var(--strong); } }
    .term-bar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--strong); font-family: var(--font-mono); font-size: 0.8rem; }
    iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--sunken); }
    .term-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .keys {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      padding: 0.5rem 0.6rem max(0.5rem, env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--border);
    }
    .keys .btn { flex: 1 1 0; min-width: 2.4rem; height: 2.5rem; font-family: var(--font-mono); }
    .keys .btn.enter { flex: 1 1 100%; }
    @media (pointer: fine) { .keys { display: none; } }
  </style>
</head>
<body>
  <div class="term-bar">
    <a href="/mac">← My Mac</a>
    <span class="name">{{ name }}</span>
    {% if sock %}<button class="btn btn-sm" data-key="redraw">Redraw</button>{% endif %}
  </div>
  {% if sock %}
  <iframe id="term" title="terminal" allow="clipboard-read; clipboard-write"></iframe>
  <div class="keys">
    <button class="btn" data-key="esc">esc</button>
    <button class="btn" data-key="tab">tab</button>
    <button class="btn" data-key="up">↑</button>
    <button class="btn" data-key="down">↓</button>
    <button class="btn" data-key="left">←</button>
    <button class="btn" data-key="right">→</button>
    <button class="btn" data-key="ctrl-l">^L</button>
    <button class="btn btn-danger" data-key="ctrl-c">^C</button>
    <button class="btn btn-primary enter" data-key="enter">⏎ Enter</button>
  </div>
  <script>
    const sock = {{ sock | tojson }};
    const term = document.getElementById("term");
    const ttydUrl =
      location.protocol + "//" + location.hostname + ":{{ ttyd_port }}/?arg=" + encodeURIComponent(sock);
    term.src = ttydUrl;

    function redraw() {
      term.src = "about:blank";
      setTimeout(() => { term.src = ttydUrl; }, 60);
    }

    document.querySelectorAll("[data-key]").forEach((b) => {
      b.addEventListener("click", (ev) => {
        ev.preventDefault();
        if (b.dataset.key === "redraw") {
          redraw();
          return;
        }
        fetch("/api/mac/keys?sock=" + encodeURIComponent(sock) + "&key=" + b.dataset.key, { method: "POST" });
      });
    });
  </script>
  {% else %}
  <div class="term-empty">No session specified</div>
  {% endif %}
</body>
</html>
