<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Terminal · My Mac</title>
  <meta name="theme-color" content="#2e3440">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* Nord palette — mirrors head_meta.html; edit both to change theme. */
    :root {
      --bg: #2e3440; --surface: #3b4252; --elevated: #434c5e; --border: #4c566a;
      --text: #e5e9f0; --muted: #7b869c; --accent: #88c0d0; --green: #a3be8c; --red: #bf616a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .bar {
      display: flex; align-items: center; gap: 0.9rem;
      padding: calc(0.6rem + env(safe-area-inset-top)) 0.9rem 0.6rem;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.85rem;
      color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .bar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .bar .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .bar-redraw {
      display: inline-block; font-family: inherit; font-size: 0.8rem; white-space: nowrap;
      color: var(--accent); background: var(--elevated); border: 1px solid var(--border); border-radius: 5px;
      padding: 0.3rem 0.7rem; cursor: pointer;
    }
    .bar-redraw:active { background: var(--border); border-color: var(--accent); }
    iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: monospace; }
    .keys {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      padding: 0.5rem 0.6rem env(safe-area-inset-bottom);
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .keys button {
      flex: 1 1 0; min-width: 2.4rem; height: 2.6rem;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9rem;
      color: var(--text); background: var(--elevated); border: 1px solid var(--border); border-radius: 6px;
    }
    .keys button:active { background: var(--border); border-color: var(--accent); }
    .keys button.enter { flex: 1 1 100%; color: var(--green); }
    .keys button.warn { color: var(--red); }
    @media (pointer: fine) { .keys { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/mac">← Mac</a>
    <span class="name">{{ name }}</span>
    {% if sock %}<button class="bar-redraw" data-key="redraw">redraw</button>{% endif %}
  </div>
  {% if sock %}
  <iframe id="term" title="terminal" allow="clipboard-read; clipboard-write"></iframe>
  <div class="keys">
    <button data-key="esc">esc</button>
    <button data-key="tab">tab</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="ctrl-l">^L</button>
    <button data-key="ctrl-c" class="warn">^C</button>
    <button data-key="enter" class="enter">⏎ enter</button>
  </div>
  <script>
    const sock = {{ sock | tojson }};
    const term = document.getElementById("term");
    const ttydUrl =
      location.protocol + "//" + location.hostname + ":{{ ttyd_port }}/?arg=" + encodeURIComponent(sock);
    term.src = ttydUrl;

    function redraw() {
      term.src = "about:blank";
      setTimeout(() => { term.src = ttydUrl; }, 60);
    }

    document.querySelectorAll("[data-key]").forEach((b) => {
      b.addEventListener("click", (ev) => {
        ev.preventDefault();
        if (b.dataset.key === "redraw") {
          redraw();
          return;
        }
        fetch("/api/mac/keys?sock=" + encodeURIComponent(sock) + "&key=" + b.dataset.key, { method: "POST" });
      });
    });
  </script>
  {% else %}
  <div class="empty">no session specified</div>
  {% endif %}
</body>
</html>
