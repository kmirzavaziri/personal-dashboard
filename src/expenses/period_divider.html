{% macro period_divider(key, name, range, total, count) %}<div class="period-divider" draggable="true" data-key="{{ key }}" title="Drag onto the last transaction of {{ name }}"><span class="pd-grip" aria-hidden="true"></span><span class="pd-name">{{ name }}</span><span class="muted">{{ range }}</span><span class="spacer"></span>{% if count %}<span class="muted amount">{{ dh }}{{ total | fmt }} · {{ count }}</span>{% endif %}</div>{% endmacro %}
