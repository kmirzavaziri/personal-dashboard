{% macro category_select(key, by_type='') %}{% set cat = categories | selectattr('key', 'equalto', key) | first %}{% set auto = categories | selectattr('key', 'equalto', by_type) | first %}<select class="vcat tone" data-options-from="category-options" aria-label="Category">{% if not cat and auto %}<option value="" data-tone="{{ tone(auto.name) }}" selected>{{ auto.name }} · auto</option>{% else %}<option value="{{ key }}" data-tone="{{ tone(cat.name) if cat else 'var(--faint)' }}" selected>{{ cat.name if cat else 'Uncategorized' }}</option>{% endif %}</select>{% endmacro %}
