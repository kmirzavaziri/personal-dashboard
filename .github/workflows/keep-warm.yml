name: keep-warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          HEALTHZ_URL: ${{ secrets.HEALTHZ_URL }}
        run: |
          [ -z "$HEALTHZ_URL" ] && { echo "HEALTHZ_URL not set; skipping"; exit 0; }
          curl -fsS -m 60 --retry 2 -A "Mozilla/5.0" "$HEALTHZ_URL"
