services:
  - type: web
    name: dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATA_REPO
        sync: false
      - key: DATA_DEPLOY_KEY_B64
        sync: false
      - key: GIT_AUTHOR_NAME
        value: dashboard
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_EMAIL
        sync: false
      - key: MCP_TOKEN
        sync: false
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
      - key: CF_PROXY_SECRET
        sync: false
      - key: WEB_HOSTS
        sync: false
      - key: ENABLE_MAC
        value: "false"
